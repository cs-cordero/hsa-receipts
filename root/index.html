<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Cordero Family HQ</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <style>
        :root {
            --offset: 19.25vw;
            --bg: #e9edf3;
            --text: #1a1a2e;
            --muted: #5b6478;
            --rule: #c8d1de;
            --accent: #0d8bf0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 3rem 2rem 3rem var(--offset);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        main {
            max-width: 34rem;
        }

        h1 {
            font-size: clamp(2.2rem, 6.5vw, 4.25rem);
            font-weight: 600;
            letter-spacing: -0.03em;
            line-height: 1.08;
            text-wrap: balance;
        }

        .name {
            color: var(--accent);
            text-shadow:
                0 0 28px rgba(13, 139, 240, 0.45),
                0 0 4px rgba(13, 139, 240, 0.25);
        }

        .rule {
            width: 3rem;
            height: 2px;
            margin: 2rem 0;
            border: 0;
            border-radius: 1px;
            background: var(--rule);
        }

        .tagline {
            font-size: 1.15rem;
            line-height: 1.6;
            color: var(--muted);
            text-wrap: balance;
        }

        /* The four-column offset gets in the way on a narrow screen. */
        @media (max-width: 52rem) {
            body {
                padding: 2.5rem 1.5rem;
            }

            .tagline {
                font-size: 1.05rem;
            }
        }
    </style>
</head>
<body>
    <main>
        <h1>Welcome to the <span class="name">Cordero</span> Family HQ</h1>

        <hr class="rule">

        <p class="tagline">Our family&rsquo;s web app tools, built by us and for us.</p>
    </main>
</body>
</html>
