<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HSA Receipts — Upload</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div id="header-left">
            <h1>HSA Receipts</h1>
            <nav>
                <a href="/">Ledger</a>
                <a href="/upload" class="active">Upload</a>
            </nav>
        </div>
        <div id="header-actions">
            <button id="sign-out-btn" onclick="signOut()" style="display:none;">Sign Out</button>
        </div>
    </header>
    <main class="upload-page">
        <div class="upload-card">
            <h2>Upload Receipt</h2>
            <div class="upload-form">
                <input type="file" id="file-input" accept=".pdf,.jpg,.jpeg,.png,.gif,.webp">
                <label class="checkbox-label">
                    <input type="checkbox" id="force-store">
                    Force store (skip eligibility check)
                </label>
                <button id="upload-btn" class="primary-btn">Upload & Analyze</button>
                <div id="spinner" class="spinner hidden"></div>
                <span id="upload-status"></span>
            </div>
        </div>
        <div id="results" class="hidden"></div>
    </main>
    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script src="upload.js"></script>
    <script>
        (async function () {
            await initAuth();
            document.getElementById("sign-out-btn").style.display = "inline";
            initUpload();
        })();
    </script>
</body>
</html>
