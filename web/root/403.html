<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>403 &middot; Cordero Family HQ</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <style>
        :root {
            --offset: 19.25vw;
            --bg: #e9edf3;
            --text: #1a1a2e;
            --muted: #5b6478;
            --glow-wide: rgba(0, 0, 0, 0.32);
            --glow-tight: rgba(0, 0, 0, 0.16);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 3rem 2rem 3rem var(--offset);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        main {
            max-width: 34rem;
        }

        h1 {
            font-size: clamp(4rem, 14vw, 9rem);
            font-weight: 600;
            letter-spacing: -0.045em;
            line-height: 1;
            text-shadow:
                0 0 34px var(--glow-wide),
                0 0 4px var(--glow-tight);
        }

        .label {
            margin-top: 1.25rem;
            font-size: 1.15rem;
            line-height: 1.6;
            color: var(--muted);
        }

        @media (max-width: 52rem) {
            body {
                padding: 2.5rem 1.5rem;
            }

            .label {
                font-size: 1.05rem;
            }
        }
    </style>
</head>
<body>
    <main>
        <h1>403</h1>

        <p class="label">Forbidden. Not for you.</p>
    </main>
</body>
</html>
