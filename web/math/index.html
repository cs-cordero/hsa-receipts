<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Math &amp; Times Tables</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <style>
    :root {
      --bg: #e8f3ff;
      --ink: #1a2740;
      --muted: #4d5d78;
      --card: #fffefb;
      --line: #c9d6ea;
      --good: #157a48;
      --good-bg: #def7e8;
      --bad: #c01d2e;
      --bad-bg: #fde8ea;
      --accent: #3b5bdb;
      --btn: #3b5bdb;
      --chip: #fff;
      --chip-on: #ffe08a;
      --sidebar-w: clamp(220px, 24vw, 300px);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      color: var(--ink);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
      background:
        radial-gradient(900px 500px at 10% -10%, #ffe3c4 0%, transparent 55%),
        radial-gradient(800px 480px at 110% 0%, #d5c7ff 0%, transparent 50%),
        radial-gradient(700px 420px at 50% 120%, #b8f0d8 0%, transparent 55%),
        linear-gradient(180deg, #eaf4ff 0%, #f7ecff 55%, #fff1dc 100%);
    }
    .blobs {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .blobs span {
      position: absolute;
      border-radius: 50%;
      opacity: 0.28;
      filter: blur(2px);
    }
    .blobs .b1 { width: 220px; height: 220px; background: #ffb4d2; left: -40px; top: 28%; }
    .blobs .b2 { width: 160px; height: 160px; background: #9ad7ff; right: 8%; top: 18%; }
    .blobs .b3 { width: 240px; height: 240px; background: #c8f5a8; right: -50px; bottom: 12%; }
    .blobs .b4 { width: 120px; height: 120px; background: #ffd36a; left: 18%; bottom: 8%; }
    .floaties {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      font-weight: 800;
      color: #3b5bdb;
      opacity: 0.14;
      font-size: 2rem;
      user-select: none;
    }
    .floaties i { position: absolute; font-style: normal; }
    .cast {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .cast img {
      position: absolute;
      opacity: 0.46;
      user-select: none;
      -webkit-user-drag: none;
      filter: drop-shadow(0 8px 14px rgba(40, 30, 80, 0.12));
    }
    .cast .pencil { left: -12px; bottom: -6px; height: min(42vh, 310px); }
    .cast .boy { right: -18px; bottom: -4px; height: min(44vh, 330px); }
    .cast .cat { right: 10%; top: 64px; height: min(20vh, 168px); opacity: 0.4; }
    .cast .kick { left: auto; right: 3%; top: 30%; height: min(26vh, 220px); opacity: 0.48; }
    .cast .four { left: 20%; bottom: 36%; height: min(20vh, 168px); opacity: 0.4; }
    .cast .pup { right: 26%; top: 8px; height: min(16vh, 140px); opacity: 0.36; }
    .cast .owl { left: 2%; top: 34%; height: min(18vh, 150px); opacity: 0.32; }
    @media (max-width: 720px) {
      .cast .cat, .cast .kick, .cast .four, .cast .pup, .cast .owl { display: none; }
      .cast img { opacity: 0.3; }
      .cast .pencil { height: 26vh; }
      .cast .boy { height: 28vh; }
    }
    header, .layout, .content, .toolbar, .settings, main { position: relative; z-index: 1; }
    header {
      padding: 12px 16px 0;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap;
    }
    h1 { font-size: 1.08rem; margin: 0; font-weight: 800; letter-spacing: -0.01em; }
    .meta {
      display: flex;
      gap: 14px;
      align-items: baseline;
      flex-wrap: wrap;
    }
    .score, .session {
      font-variant-numeric: tabular-nums;
      color: var(--muted);
      font-size: 0.95rem;
    }
    .session.warn { color: #b45309; font-weight: 700; }
    /* Start, Stop, and 1-min speed stay out of the sidebar and always reachable. They sit
       inside .content, so an open sidebar pushes the whole bar to the right instead of
       running underneath it. */
    .toolbar {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      padding: 8px 16px 4px;
    }
    .layout {
      flex: 1;
      display: flex;
      align-items: stretch;
      min-height: 0;
    }
    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }
    /* Two fields on one row, for Total time + Think and Min + Max. */
    .settings .row {
      display: flex;
      gap: 10px;
    }
    .settings .row > label { flex: 1; min-width: 0; }
    .field-note {
      margin-top: 2px;
      font-size: 0.75rem;
      font-weight: 400;
      color: var(--muted);
    }
    /* The sidebar floats above the game rather than taking a column of its own, so the
       question stays centred in the window whether the panel is open or shut. Only the
       button bar steps aside, via the padding rule below. */
    .settings {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: var(--sidebar-w);
      z-index: 5;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 12px 16px 20px;
      overflow-y: auto;
      border-right: 1px solid var(--line);
      background: color-mix(in srgb, var(--card) 94%, transparent);
      backdrop-filter: blur(8px);
      box-shadow: 6px 0 26px rgba(50, 40, 90, 0.13);
    }
    /* `display: flex` above would otherwise beat the hidden attribute. */
    .settings[hidden] { display: none; }
    body.settings-open .toolbar {
      padding-left: calc(var(--sidebar-w) + 16px);
    }
    button.toggle {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--line);
    }
    button.speed {
      background: #e8590c;
    }
    /* Too narrow to float a panel over the game and still leave room for it. Go back to a
       stacked panel that pushes the game down, and let the button bar sit below it. */
    @media (max-width: 720px) {
      .layout { flex-direction: column; }
      .settings {
        position: static;
        width: auto;
        flex: none;
        border-right: 0;
        border-bottom: 1px solid var(--line);
        max-height: 55vh;
        box-shadow: none;
        backdrop-filter: none;
      }
      body.settings-open .toolbar { padding-left: 16px; }
    }
    label {
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-size: 0.75rem;
      color: var(--muted);
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    input[type="number"] {
      width: 4.4rem;
      padding: 6px 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 1rem;
      background: var(--card);
    }
    .check {
      flex-direction: row;
      align-items: center;
      gap: 6px;
      padding-bottom: 6px;
    }
    .check input { width: auto; }
    .mode {
      display: flex;
      background: rgba(255,255,255,0.7);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 3px;
      gap: 2px;
      margin-bottom: 2px;
    }
    .mode button {
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 0.82rem;
      background: transparent;
      color: var(--ink);
    }
    .mode button.on {
      background: var(--accent);
      color: #fff;
    }
    .tables {
      display: none;
      width: 100%;
      flex-basis: 100%;
      flex-direction: column;
      gap: 6px;
    }
    .tables.show { display: flex; }
    .range-fields.hide { display: none; }
    .chip-label { font-size: 0.75rem; color: var(--muted); font-weight: 600; }
    #negWrap { display: none; }
    #negWrap.show { display: flex; }
    #arithPanel.show #negWrap { display: none; }
    #arithPanel.show.sub #negWrap { display: flex; }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .chips button {
      width: 2.15rem;
      height: 2.15rem;
      padding: 0;
      border-radius: 10px;
      background: var(--chip);
      color: var(--ink);
      border: 1px solid var(--line);
      font-size: 0.95rem;
    }
    .chips button.on {
      background: #ffd24d;
      border-color: #e2b000;
      color: #3a2a00;
    }
    .quick {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .quick button {
      background: rgba(255,255,255,0.75);
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 0.75rem;
      font-weight: 700;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px 16px 24px;
    }
    .stage { position: relative;
      background: color-mix(in srgb, var(--card) 92%, transparent);
      border: 1px solid color-mix(in srgb, var(--line) 80%, white);
      border-radius: 22px;
      padding: 18px 22px 22px;
      width: min(420px, 92vw);
      margin: 0 auto;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 12px 34px rgba(50, 40, 90, 0.08);
      backdrop-filter: blur(8px);
    }
    .problem {
      font-size: clamp(2.6rem, 12vw, 5.2rem);
      font-weight: 800;
      letter-spacing: 0.02em;
      margin: 0 0 8px;
      font-variant-numeric: tabular-nums;
    }

    .problem.horiz {
      text-align: center;
    }
    .problem.vert {
      width: max-content;
      max-width: 100%;
      margin: 0 auto 8px;
      font-size: clamp(2.3rem, 9vw, 3.8rem);
      line-height: 1.15;
      text-align: center;
    }
    .problem.vert table {
      border-collapse: collapse;
      margin: 0 auto;
      font-variant-numeric: tabular-nums;
    }
    .problem.vert td {
      width: 1.2em;
      min-width: 1.2em;
      padding: 0;
      text-align: right;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }
    .problem.vert td.op {
      width: 1.25em;
      min-width: 1.25em;
      padding-right: 0.12em;
      text-align: right;
    }
    .problem.vert tr.rule td {
      height: 0;
      padding-top: 0.18em;
      border-bottom: 4px solid var(--ink);
    }
    .feedback {
      min-height: 1.6rem;
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 18px;
    }
    .feedback.good { color: var(--good); }
    .feedback.bad { color: var(--bad); }
    #burst {
      position: absolute;
      left: 50%;
      top: 10%;
      transform: translate(-50%, -20%) scale(0.6);
      line-height: 1;
      pointer-events: none;
      opacity: 0;
      z-index: 3;
    }
    #burst img, #burst svg {
      width: clamp(96px, 24vw, 140px);
      height: auto;
      display: block;
      filter: drop-shadow(0 8px 16px rgba(40, 30, 80, 0.2));
    }
    #burst.show {
      animation: burstPop 0.85s ease-out forwards;
    }
    #burst.show.sad {
      animation: burstPop 1.25s ease-out forwards;
    }
    @keyframes burstPop {
      0% { opacity: 0; transform: translate(-50%, 8%) scale(0.4); }
      22% { opacity: 1; transform: translate(-50%, -18%) scale(1.12); }
      70% { opacity: 1; transform: translate(-50%, -22%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -40%) scale(0.9); }
    }
    form {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: min(280px, 100%);
      margin: 0 auto;
    }
    #answer {
      width: 100%;
      max-width: 280px;
      margin: 0 auto;
      font-size: 2rem;
      text-align: center;
      padding: 12px 14px;
      border: 2px solid var(--line);
      border-radius: 14px;
      background: var(--card);
      font-variant-numeric: tabular-nums;
    }
    #answer:focus {
      outline: 3px solid color-mix(in srgb, var(--accent) 35%, white);
      border-color: var(--accent);
    }
    #answer.good { background: var(--good-bg); border-color: var(--good); }
    #answer.bad { background: var(--bad-bg); border-color: var(--bad); }

    .pad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      width: 100%;
      max-width: 280px;
      margin: 0 auto;
      touch-action: manipulation;
    }
    .pad button {
      padding: 14px 0;
      font-size: 1.35rem;
      border-radius: 14px;
      background: #2f4ea3;
      min-height: 48px;
      -webkit-tap-highlight-color: transparent;
    }
    .pad button.wide { }
    .pad button.ghost {
      background: #eef2fb;
      color: var(--ink);
    }
    #answer {
      caret-color: transparent;
    }
    .row { display: flex; gap: 8px; width: 100%; max-width: 280px; justify-content: center; margin: 0 auto; }
    .row button { flex: 1; min-width: 0; }
    button {
      appearance: none;
      border: 0;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      background: var(--btn);
      color: white;
    }
    button.ghost {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--line);
    }
    button.stop { background: #c45c3a; }
    button:disabled { opacity: 0.55; cursor: default; }
    .controls { display: flex; gap: 8px; align-items: center; padding-bottom: 4px; flex-wrap: wrap; }

    #playerName {
      width: 8.5rem;
      padding: 6px 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 1rem;
      background: var(--card);
    }
    .board {
      width: min(420px, 92vw);
      margin: 14px auto 0;
      background: color-mix(in srgb, var(--card) 90%, transparent);
      border: 1px solid color-mix(in srgb, var(--line) 80%, white);
      border-radius: 18px;
      padding: 12px 14px 10px;
      box-shadow: 0 8px 24px rgba(50, 40, 90, 0.06);
      text-align: left;
    }
    .board h2 {
      margin: 0 0 8px;
      font-size: 0.92rem;
    }
    .board-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 8px;
    }
    .board-tabs button {
      padding: 6px 10px;
      font-size: 0.75rem;
      border-radius: 999px;
      background: rgba(255,255,255,0.8);
      color: var(--ink);
      border: 1px solid var(--line);
    }
    .board-tabs button.on {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .board ol {
      margin: 0;
      padding: 0 0 0 1.2rem;
      font-variant-numeric: tabular-nums;
    }
    .board li {
      margin: 3px 0;
      font-size: 0.88rem;
    }
    .board .empty {
      color: var(--muted);
      font-size: 0.85rem;
      margin: 4px 0 8px;
    }
    .board-foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }
    .board-foot button {
      padding: 5px 10px;
      font-size: 0.72rem;
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 999px;
    }
    .timer {
      font-variant-numeric: tabular-nums;
      color: var(--muted);
      font-size: 0.9rem;
      min-height: 1.2rem;
    }

    /* A narrow screen gives the Settings toggle a row of its own. The spacer, not the button,
       claims the rest of the line, so the button keeps its own width and Start, Stop, and
       1-min speed drop to the next row together. */
    .toolbar .row-break { display: none; }
    @media (max-width: 560px) {
      .toolbar .row-break {
        display: block;
        flex: 0 0 100%;
        height: 0;
        margin: 0;
      }
    }

    /* A phone held sideways has width to spare and almost no height. Put the question on the
       left, the keypad on the right, and leave the high scores below both.
       This block comes last on purpose: it has to beat the max-width rules above, which would
       otherwise stack the sidebar on top and eat the little height there is. */
    @media (orientation: landscape) and (max-height: 540px) {
      /* Every row costs the game height here. Drop the title and let the session clock and
         score carry the top edge on their own. The title only names the current mode, and
         the settings panel already shows which mode is on. */
      #appTitle { display: none; }
      /* With the title gone, the left of the header row is empty. Lift the button bar out of
         the flow and into that gap, so the session clock and score share one row with the
         buttons. That hands a whole row of height back to the game. */
      header {
        padding: 4px 16px 0;
        justify-content: flex-end;
        align-items: center;
        min-height: 40px;
      }
      .meta { font-size: 0.85rem; }
      /* `fixed`, not `absolute`. Both .layout and .content are position: relative for
         stacking, so an absolute bar would anchor to .content and land on top of the game.
         Fixed skips them and measures from the viewport, which is where the header row is. */
      .toolbar {
        position: fixed;
        top: 4px;
        left: 16px;
        padding: 0;
        z-index: 6;
      }
      .toolbar button {
        padding: 7px 11px;
        font-size: 0.82rem;
        border-radius: 10px;
      }

      /* Width to spare here, so float the panel again and keep the height for the game. */
      :root { --sidebar-w: clamp(180px, 26vw, 240px); }
      .layout { flex-direction: row; }
      .settings {
        position: absolute;
        width: var(--sidebar-w);
        flex: none;
        border-right: 1px solid var(--line);
        border-bottom: 0;
        max-height: none;
        box-shadow: 6px 0 26px rgba(50, 40, 90, 0.13);
        backdrop-filter: blur(8px);
      }
      /* The bar is positioned here, not padded, so move it with `left` instead. */
      body.settings-open .toolbar {
        padding-left: 0;
        left: calc(var(--sidebar-w) + 16px);
      }
      main {
        justify-content: flex-start;
        overflow-y: auto;
        padding: 4px 12px 12px;
      }
      .stage {
        width: min(760px, 96vw);
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        grid-template-areas:
          "timer    form"
          "problem  form"
          "feedback form";
        align-items: center;
        column-gap: 20px;
        padding: 10px 18px 14px;
        text-align: left;
      }
      .stage .timer { grid-area: timer; }
      .stage .problem {
        grid-area: problem;
        font-size: clamp(2rem, 7vw, 3.6rem);
        margin-bottom: 4px;
      }
      .stage .feedback {
        grid-area: feedback;
        margin-bottom: 0;
        min-height: 1.3rem;
      }
      .stage form {
        grid-area: form;
        width: 210px;
        gap: 8px;
      }
      .pad { max-width: 210px; gap: 6px; }
      .pad button {
        padding: 8px 0;
        min-height: 38px;
        font-size: 1.1rem;
        border-radius: 11px;
      }
      .board { margin-top: 10px; }
    }
  </style>
</head>
<body>
  <div class="blobs" aria-hidden="true">
    <span class="b1"></span><span class="b2"></span><span class="b3"></span><span class="b4"></span>
  </div>
  <div class="floaties" aria-hidden="true">
    <i style="left:12%;top:22%">×</i>
    <i style="left:72%;top:30%">+</i>
    <i style="left:48%;top:8%">÷</i>
    <i style="left:88%;top:58%">9</i>
    <i style="left:8%;top:62%">3</i>
    <i style="left:40%;bottom:10%">=</i>

  <header>
    <h1 id="appTitle">Times tables</h1>
    <div class="meta">
      <div class="session" id="sessionClock">Session: off</div>
      <div class="score" id="score">0 right · 0 wrong</div>
    </div>
  </header>

  <div class="layout">
  <aside class="settings" id="settings">
    <label>Name
      <input id="playerName" type="text" maxlength="16" placeholder="Your name" autocomplete="nickname" />
    </label>
    <div class="row">
      <label>Total time (min)
        <input id="sessionMin" type="number" min="0" max="60" value="3" step="0.5" />
      </label>
      <label>Think (sec)
        <input id="think" type="number" min="0" max="30" value="8" />
        <span class="field-note">Time per question</span>
      </label>
    </div>
    <label>Operation
      <div class="mode" role="tablist">
        <button type="button" id="opMul" class="on">×</button>
        <button type="button" id="opAdd">+</button>
        <button type="button" id="opSub">−</button>
      </div>
    </label>
    <label id="factorModeWrap">Mode
      <div class="mode" role="tablist">
        <button type="button" id="modeRange" class="on">Range</button>
        <button type="button" id="modeTables">Tables</button>
      </div>
    </label>
    <div class="row range-fields" id="rangeRow">
      <label class="range-fields" id="minWrap">Min
        <input id="minN" type="number" min="0" max="20" value="1" />
      </label>
      <label class="range-fields" id="maxWrap">Max
        <input id="maxN" type="number" min="1" max="20" value="10" />
      </label>
    </div>
    <label class="check">
      <input id="autoReveal" type="checkbox" checked />
      Show answer if time runs out
    </label>
    <div class="tables" id="arithPanel">
      <span class="chip-label" id="digitLabel">Digits</span>
      <div class="chips" id="digitChips"></div>
      <label class="check" id="negWrap">
        <input id="allowNeg" type="checkbox" />
        Allow negative answers
      </label>
    </div>
    <div class="tables" id="tablesPanel">
      <div class="chips" id="tableChips"></div>
      <div class="quick">
        <button type="button" data-quick="2-5">2–5</button>
        <button type="button" data-quick="2-12">2–12</button>
        <button type="button" data-quick="6-9">6–9</button>
        <button type="button" data-quick="10-12">10–12</button>
        <button type="button" data-quick="all">1–12</button>
      </div>
      <label>Other factor up to
        <input id="uptoN" type="number" min="1" max="20" value="12" />
      </label>
    </div>
  </aside>

  <div class="content">
  <div class="toolbar">
    <button type="button" class="toggle" id="settingsToggle" aria-expanded="true" aria-controls="settings">Hide settings</button>
    <span class="row-break" aria-hidden="true"></span>
    <button type="button" id="startBtn">Start</button>
    <button type="button" class="stop" id="stopBtn" disabled>Stop</button>
    <button type="button" class="speed" id="speedBtn">1-min speed</button>
  </div>

  <main>
    <div class="stage">
      <p class="timer" id="timer"></p>
      <div class="problem" id="problem">7 × 8</div>
      <p class="feedback" id="feedback">&nbsp;</p>
      <div id="burst" aria-hidden="true"></div>
      <form id="form" autocomplete="off">
        <input id="answer" type="text" inputmode="none" readonly autocomplete="off" aria-label="Answer" />
        <div class="pad" id="numPad" aria-label="Number pad">
          <button type="button" data-k="1">1</button>
          <button type="button" data-k="2">2</button>
          <button type="button" data-k="3">3</button>
          <button type="button" data-k="4">4</button>
          <button type="button" data-k="5">5</button>
          <button type="button" data-k="6">6</button>
          <button type="button" data-k="7">7</button>
          <button type="button" data-k="8">8</button>
          <button type="button" data-k="9">9</button>
          <button type="button" class="ghost" data-k="-">−</button>
          <button type="button" data-k="0">0</button>
          <button type="button" class="ghost" data-k="bs">⌫</button>
        </div>
        <div class="row">
          <button type="submit" id="checkBtn">Check</button>
          <button type="button" class="ghost" id="nextBtn">Skip</button>
        </div>
      </form>
    </div>
    <aside class="board" id="scoreBoard" aria-label="High scores">
      <h2>High scores</h2>
      <div class="board-tabs" id="boardTabs"></div>
      <div id="boardBody"></div>
      <div class="board-foot">
        <span class="empty" id="boardNote">Saved on this device only.</span>
        <button type="button" id="clearScoresBtn">Clear board</button>
      </div>
    </aside>
  </main>
  </div>
  </div>

  <script>
    const el = (id) => document.getElementById(id);
    const problemEl = el("problem");
    const feedbackEl = el("feedback");
    const answerEl = el("answer");
    const scoreEl = el("score");
    const timerEl = el("timer");
    const sessionEl = el("sessionClock");
    const checkBtn = el("checkBtn");
    const startBtn = el("startBtn");
    const stopBtn = el("stopBtn");
    const nextBtn = el("nextBtn");
    const tablesPanel = el("tablesPanel");
    const chipsEl = el("tableChips");

    let a = 0, b = 0, product = 0, op = "mul", layout = "h";
    let selectedOps = new Set(["mul"]);
    let right = 0, wrong = 0;
    let locked = false;
    let running = false;
    let tick = null;
    let remaining = 0;
    let advanceTimer = null;
    let sessionTick = null;
    let sessionLeft = 0;
    let mode = "range"; // range | tables
    let selectedTables = new Set([2,3,4,5]);
    let selectedDigits = new Set([1,2]);
    let sessionLimitMin = 0;
    let sessionFinished = false;
    let activeBoard = "r16";
    const STORE = "ttq-highscores-v1";
    const NAME_STORE = "ttq-name";
    const BOARDS = [
      { id: "r16", label: "1–6 range" },
      { id: "r712", label: "7–12 range" },
      { id: "r112", label: "1–12 range" },
      { id: "speed", label: "1-min speed" }
    ];

    function randInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function buildChips() {
      chipsEl.innerHTML = "";
      for (let n = 1; n <= 12; n++) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = n;
        btn.dataset.n = String(n);
        if (selectedTables.has(n)) btn.classList.add("on");
        btn.addEventListener("click", () => {
          if (selectedTables.has(n)) {
            if (selectedTables.size === 1) return;
            selectedTables.delete(n);
            btn.classList.remove("on");
          } else {
            selectedTables.add(n);
            btn.classList.add("on");
          }
        });
        chipsEl.appendChild(btn);
      }
    }

    function opSymbol() {
      return op === "add" ? "+" : op === "sub" ? "−" : "×";
    }

    function equation() {
      return a + " " + opSymbol() + " " + b;
    }

    function renderProblem() {
      problemEl.classList.remove("vert", "horiz");
      if (layout === "v") {
        const sa = String(Math.abs(a));
        const sb = String(Math.abs(b));
        const places = Math.max(sa.length, sb.length);
        const pa = sa.padStart(places, " ");
        const pb = sb.padStart(places, " ");
        function row(opCell, digits) {
          let tds = "<td class=\"op\">" + opCell + "</td>";
          for (const ch of digits) {
            tds += "<td>" + (ch === " " ? "&nbsp;" : ch) + "</td>";
          }
          return "<tr>" + tds + "</tr>";
        }
        const cols = places + 1;
        const html = "<table><tbody>"
          + row("", pa)
          + row(opSymbol(), pb)
          + "<tr class=\"rule\"><td colspan=\"" + cols + "\"></td></tr>"
          + "</tbody></table>";
        problemEl.classList.add("vert");
        problemEl.innerHTML = html;
      } else {
        problemEl.classList.add("horiz");
        problemEl.textContent = equation();
      }
    }

    function digitRange(d) {
      if (d === 1) return [0, 9];
      if (d === 2) return [10, 99];
      return [100, 999];
    }

    function randFromDigits() {
      const ds = [...selectedDigits];
      if (!ds.length) ds.push(1);
      const d = ds[randInt(0, ds.length - 1)];
      const [lo, hi] = digitRange(d);
      return randInt(lo, hi);
    }

    function syncOpUi() {
      const hasMul = selectedOps.has("mul");
      const hasAdd = selectedOps.has("add");
      const hasSub = selectedOps.has("sub");
      el("opMul").classList.toggle("on", hasMul);
      el("opAdd").classList.toggle("on", hasAdd);
      el("opSub").classList.toggle("on", hasSub);
      el("factorModeWrap").style.display = hasMul ? "" : "none";
      tablesPanel.classList.toggle("show", hasMul && mode === "tables");
      document.querySelectorAll(".range-fields").forEach((n) => {
        n.classList.toggle("hide", !hasMul || mode === "tables");
      });
      const arith = el("arithPanel");
      arith.classList.toggle("show", hasAdd || hasSub);
      arith.classList.toggle("sub", hasSub);
      el("negWrap").classList.toggle("show", hasSub);
      const n = selectedOps.size;
      if (n > 1) el("appTitle").textContent = "Mixed practice";
      else if (hasAdd) el("appTitle").textContent = "Addition";
      else if (hasSub) el("appTitle").textContent = "Subtraction";
      else el("appTitle").textContent = "Times tables";
    }

    function toggleOp(next) {
      if (selectedOps.has(next)) {
        if (selectedOps.size === 1) return;
        selectedOps.delete(next);
      } else {
        selectedOps.add(next);
      }
      if (!selectedOps.has(op)) op = [...selectedOps][0];
      syncOpUi();
    }

    function setOp(next) {
      selectedOps = new Set([next]);
      op = next;
      syncOpUi();
    }

    function setMode(next) {
      mode = next;
      el("modeRange").classList.toggle("on", mode === "range");
      el("modeTables").classList.toggle("on", mode === "tables");
      syncOpUi();
    }

    function clampSettings() {
      let min = parseInt(el("minN").value, 10);
      let max = parseInt(el("maxN").value, 10);
      if (Number.isNaN(min)) min = 1;
      if (Number.isNaN(max)) max = 10;
      min = Math.max(0, Math.min(20, min));
      max = Math.max(min, Math.min(20, max));
      el("minN").value = min;
      el("maxN").value = max;
      let upto = parseInt(el("uptoN").value, 10);
      if (Number.isNaN(upto)) upto = 12;
      upto = Math.max(1, Math.min(20, upto));
      el("uptoN").value = upto;
      return { min, max, upto };
    }

    function pickProblem() {
      const { min, max, upto } = clampSettings();
      const ops = [...selectedOps];
      op = ops[randInt(0, ops.length - 1)] || "mul";
      layout = Math.random() < 0.5 ? "v" : "h";
      if (op === "add") {
        a = randFromDigits();
        b = randFromDigits();
        product = a + b;
      } else if (op === "sub") {
        a = randFromDigits();
        b = randFromDigits();
        if (!el("allowNeg").checked && a < b) {
          const tmp = a; a = b; b = tmp;
        }
        product = a - b;
      } else if (mode === "tables") {
        const tables = [...selectedTables];
        if (!tables.length) tables.push(2,3,4,5);
        const t = tables[randInt(0, tables.length - 1)];
        const n = randInt(1, upto);
        if (Math.random() < 0.5) { a = t; b = n; }
        else { a = n; b = t; }
        product = a * b;
      } else {
        a = randInt(min, max);
        b = randInt(min, max);
        product = a * b;
      }
    }

    function formatClock(sec) {
      sec = Math.max(0, Math.ceil(sec));
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return m + ":" + String(s).padStart(2, "0");
    }

    function renderSession() {
      const limit = parseFloat(el("sessionMin").value);
      if (!running) {
        sessionEl.className = "session";
        if (!limit || limit <= 0) sessionEl.textContent = "Session: off";
        else sessionEl.textContent = "Session: " + limit + " min";
        return;
      }
      if (sessionLeft <= 0 && (!limit || limit <= 0)) {
        sessionEl.className = "session";
        sessionEl.textContent = "Session: open";
        return;
      }
      sessionEl.textContent = "Left: " + formatClock(sessionLeft);
      sessionEl.className = sessionLeft <= 15 ? "session warn" : "session";
    }

    function stopThinkTimer() {
      if (tick) clearInterval(tick);
      tick = null;
      timerEl.textContent = "";
    }

    function stopSessionTimer() {
      if (sessionTick) clearInterval(sessionTick);
      sessionTick = null;
    }

    function cancelAdvance() {
      if (advanceTimer) clearTimeout(advanceTimer);
      advanceTimer = null;
    }

    function setRunning(on) {
      running = on;
      startBtn.disabled = on;
      stopBtn.disabled = !on;
      answerEl.disabled = !on || locked;
      checkBtn.disabled = !on || locked;
      nextBtn.disabled = !on;
      el("numPad").querySelectorAll("button").forEach((b) => { b.disabled = !on; });
    }

    function playerName() {
      const n = (el("playerName").value || "").trim().replace(/\s+/g, " ");
      return n.slice(0, 16);
    }

    function loadScores() {
      try {
        const raw = localStorage.getItem(STORE);
        const data = raw ? JSON.parse(raw) : {};
        const out = {};
        BOARDS.forEach((b) => {
          out[b.id] = Array.isArray(data[b.id]) ? data[b.id] : [];
        });
        return out;
      } catch (e) {
        const out = {};
        BOARDS.forEach((b) => { out[b.id] = []; });
        return out;
      }
    }

    function saveScores(data) {
      localStorage.setItem(STORE, JSON.stringify(data));
    }

    function renderBoard() {
      const tabs = el("boardTabs");
      if (!tabs.dataset.ready) {
        tabs.innerHTML = "";
        BOARDS.forEach((b) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.textContent = b.label;
          btn.dataset.id = b.id;
          btn.addEventListener("click", () => {
            activeBoard = b.id;
            renderBoard();
          });
          tabs.appendChild(btn);
        });
        tabs.dataset.ready = "1";
      }
      tabs.querySelectorAll("button").forEach((btn) => {
        btn.classList.toggle("on", btn.dataset.id === activeBoard);
      });
      const rows = loadScores()[activeBoard] || [];
      const body = el("boardBody");
      if (!rows.length) {
        body.innerHTML = '<p class="empty">No scores yet.</p>';
        return;
      }
      const ol = document.createElement("ol");
      rows.slice(0, 8).forEach((row) => {
        const li = document.createElement("li");
        const who = row.name || "Player";
        const mark = row.op === "add" ? "+" : row.op === "sub" ? "−" : "×";
        const extra = activeBoard === "speed" ? " " + mark : "";
        li.textContent = who + extra + " — " + row.right + " right · " + row.wrong + " wrong";
        ol.appendChild(li);
      });
      body.innerHTML = "";
      body.appendChild(ol);
    }

    function matchingBoards(reason) {
      const { min, max } = clampSettings();
      const ids = [];
      const mulOnly = selectedOps.size === 1 && selectedOps.has("mul");
      if (mulOnly && mode === "range" && min === 1 && max === 6) ids.push("r16");
      if (mulOnly && mode === "range" && min === 7 && max === 12) ids.push("r712");
      if (mulOnly && mode === "range" && min === 1 && max === 12) ids.push("r112");
      if (reason === "timesup" && sessionLimitMin === 1) ids.push("speed");
      return ids;
    }

    function recordScores(reason) {
      if (right + wrong === 0) return [];
      const ids = matchingBoards(reason);
      if (!ids.length) return [];
      const name = playerName() || "Player";
      const data = loadScores();
      const entry = {
        name,
        right,
        wrong,
        at: Date.now(),
        op,
        mode,
        min: parseInt(el("minN").value, 10),
        max: parseInt(el("maxN").value, 10)
      };
      ids.forEach((id) => {
        const list = data[id] || [];
        list.push(entry);
        list.sort((x, y) => {
          if (y.right !== x.right) return y.right - x.right;
          if (x.wrong !== y.wrong) return x.wrong - y.wrong;
          return y.at - x.at;
        });
        data[id] = list.slice(0, 8);
      });
      saveScores(data);
      if (ids.length) {
        activeBoard = ids[ids.length - 1];
        renderBoard();
      }
      return ids;
    }

    function idleScreen(msg) {
      cancelAdvance();
      stopThinkTimer();
      stopSessionTimer();
      locked = true;
      setRunning(false);
      problemEl.classList.remove("vert", "horiz");
      problemEl.style.removeProperty("--places");
      problemEl.textContent = "Ready";
      feedbackEl.textContent = msg || "\u00a0";
      feedbackEl.className = "feedback";
      answerEl.value = "";
      answerEl.className = "";
      renderSession();
    }

    function endSession() {
      sessionFinished = true;
      const posted = recordScores("timesup");
      let summary = "Time's up — " + right + " right · " + wrong + " wrong";
      if (posted.length) summary += ". Saved to high scores.";
      idleScreen(summary);
      problemEl.classList.remove("vert", "horiz");
      problemEl.style.removeProperty("--places");
      problemEl.textContent = "Done";
    }

    function startSessionClock() {
      stopSessionTimer();
      const mins = parseFloat(el("sessionMin").value);
      sessionLimitMin = (!mins || mins <= 0) ? 0 : mins;
      sessionFinished = false;
      if (!mins || mins <= 0) {
        sessionLeft = 0;
        renderSession();
        return;
      }
      sessionLeft = Math.round(mins * 60);
      renderSession();
      sessionTick = setInterval(() => {
        sessionLeft -= 1;
        renderSession();
        if (sessionLeft <= 0) {
          endSession();
        }
      }, 1000);
    }

    function nextProblem() {
      if (!running) return;
      cancelAdvance();
      stopThinkTimer();
      locked = false;
      pickProblem();
      renderProblem();
      feedbackEl.textContent = "\u00a0";
      const burst = el("burst");
      if (burst) { burst.className = ""; burst.innerHTML = ""; }
      feedbackEl.className = "feedback";
      answerEl.value = "";
      answerEl.className = "";
      answerEl.disabled = false;
      checkBtn.disabled = false;

      const think = parseFloat(el("think").value);
      if (el("autoReveal").checked && think > 0) {
        remaining = think;
        timerEl.textContent = remaining.toFixed(0) + "s";
        tick = setInterval(() => {
          remaining -= 1;
          if (remaining > 0) {
            timerEl.textContent = remaining.toFixed(0) + "s";
          } else {
            stopThinkTimer();
            reveal("Time's up. " + equation() + " = " + product, false);
          }
        }, 1000);
      }
    }

    function chibiFace(happy) {
      const pack = happy ? HAPPY_FACES : SAD_FACES;
      return '<img src="' + pack[Math.floor(Math.random() * pack.length)] + '" alt="">';
    }

    function reveal(msg, isRight) {
      if (!running || locked) return;
      locked = true;
      stopThinkTimer();
      answerEl.disabled = true;
      checkBtn.disabled = true;
      feedbackEl.textContent = msg;
      feedbackEl.className = "feedback " + (isRight ? "good" : "bad");
      answerEl.className = isRight ? "good" : "bad";
      if (isRight) right += 1;
      else wrong += 1;
      scoreEl.textContent = right + " right · " + wrong + " wrong";
      const burst = el("burst");
      burst.className = "";
      burst.innerHTML = chibiFace(isRight);
      void burst.offsetWidth;
      burst.className = "show" + (isRight ? "" : " sad");
      cancelAdvance();
      advanceTimer = setTimeout(nextProblem, isRight ? 900 : 1600);
    }

    function submitAnswer() {
      if (!running || locked) return;
      const raw = answerEl.value.trim();
      if (raw === "" || raw === "-") return;
      const guess = Number(raw);
      if (guess === product) {
        reveal("Yes — " + equation() + " = " + product, true);
      } else {
        reveal("Not quite. " + equation() + " = " + product, false);
      }
    }

    function typeKey(k) {
      if (!running || locked) return;
      if (k === "bs") {
        answerEl.value = answerEl.value.slice(0, -1);
        return;
      }
      if (k === "-") {
        if (answerEl.value.startsWith("-")) answerEl.value = answerEl.value.slice(1);
        else answerEl.value = "-" + answerEl.value;
        return;
      }
      if (answerEl.value === "0") answerEl.value = k;
      else if (answerEl.value === "-0") answerEl.value = "-" + k;
      else answerEl.value += k;
    }

    el("form").addEventListener("submit", (e) => {
      e.preventDefault();
      submitAnswer();
    });

    el("numPad").addEventListener("pointerdown", (e) => {
      const btn = e.target.closest("button");
      if (!btn) return;
      e.preventDefault();
      typeKey(btn.dataset.k);
    });

    answerEl.addEventListener("focus", () => answerEl.blur());

    document.addEventListener("keydown", (e) => {
      if (e.target && e.target.tagName === "INPUT" && e.target.id !== "answer") return;
      if (!running || locked) return;
      if (e.key >= "0" && e.key <= "9") {
        e.preventDefault();
        typeKey(e.key);
      } else if (e.key === "Backspace") {
        e.preventDefault();
        typeKey("bs");
      } else if (e.key === "-" || e.key === "−") {
        e.preventDefault();
        typeKey("-");
      } else if (e.key === "Enter") {
        e.preventDefault();
        submitAnswer();
      }
    });

    el("nextBtn").addEventListener("click", () => {
      if (!running) return;
      if (locked) {
        nextProblem();
        return;
      }
      reveal("Skipped. " + equation() + " = " + product, false);
    });

    function beginRun() {
      cancelAdvance();
      stopThinkTimer();
      stopSessionTimer();
      // Every run starts from zero, whether it began at Start or at 1-min speed.
      right = 0;
      wrong = 0;
      scoreEl.textContent = "0 right · 0 wrong";
      locked = false;
      setRunning(true);
      startSessionClock();
      nextProblem();
    }

    // The sidebar always opens on load. Starting a run closes it, but that close is not
    // remembered — a refresh brings the settings back.
    const settingsPanel = el("settings");
    const settingsToggle = el("settingsToggle");

    function setSettingsOpen(open) {
      settingsPanel.hidden = !open;
      // The class is what moves the button bar clear of the floating panel.
      document.body.classList.toggle("settings-open", open);
      settingsToggle.setAttribute("aria-expanded", String(open));
      settingsToggle.textContent = open ? "Hide settings" : "Settings";
    }

    setSettingsOpen(true);

    settingsToggle.addEventListener("click", () => setSettingsOpen(settingsPanel.hidden));

    startBtn.addEventListener("click", () => {
      setSettingsOpen(false);
      beginRun();
    });

    el("speedBtn").addEventListener("click", () => {
      if (op === "mul") {
        setMode("range");
        el("minN").value = "1";
        el("maxN").value = "12";
      }
      el("think").value = "5";
      el("sessionMin").value = "1";
      setSettingsOpen(false);
      beginRun();
    });

    // Stop ends the session the same way the clock running out does. The reason stays "stop"
    // so a stopped run cannot claim the 1-min speed board.
    stopBtn.addEventListener("click", () => {
      sessionFinished = true;
      stopSessionTimer();
      const posted = recordScores("stop");
      let summary = "Stopped — " + right + " right · " + wrong + " wrong";
      if (posted.length) summary += ". Saved to high scores.";
      idleScreen(summary);
      problemEl.classList.remove("vert", "horiz");
      problemEl.style.removeProperty("--places");
      problemEl.textContent = "Done";
    });

    el("sessionMin").addEventListener("input", () => {
      if (!running) renderSession();
    });

    el("modeRange").addEventListener("click", () => setMode("range"));
    el("modeTables").addEventListener("click", () => setMode("tables"));

    document.querySelectorAll("[data-quick]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const key = btn.dataset.quick;
        selectedTables = new Set();
        if (key === "all") {
          for (let n = 1; n <= 12; n++) selectedTables.add(n);
        } else {
          const [lo, hi] = key.split("-").map(Number);
          for (let n = lo; n <= hi; n++) selectedTables.add(n);
        }
        chipsEl.querySelectorAll("button").forEach((c) => {
          c.classList.toggle("on", selectedTables.has(Number(c.dataset.n)));
        });
      });
    });

    function buildDigitChips() {
      const box = el("digitChips");
      box.innerHTML = "";
      [1,2,3].forEach((d) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = d + "-digit";
        btn.style.width = "auto";
        btn.style.padding = "0 10px";
        if (selectedDigits.has(d)) btn.classList.add("on");
        btn.addEventListener("click", () => {
          if (selectedDigits.has(d)) {
            if (selectedDigits.size === 1) return;
            selectedDigits.delete(d);
            btn.classList.remove("on");
          } else {
            selectedDigits.add(d);
            btn.classList.add("on");
          }
        });
        box.appendChild(btn);
      });
    }

    buildChips();
    buildDigitChips();
    el("opMul").addEventListener("click", () => toggleOp("mul"));
    el("opAdd").addEventListener("click", () => toggleOp("add"));
    el("opSub").addEventListener("click", () => toggleOp("sub"));
    syncOpUi();
    setMode("range");
    try {
      const savedName = localStorage.getItem(NAME_STORE);
      if (savedName) el("playerName").value = savedName;
    } catch (e) {}
    el("playerName").addEventListener("change", () => {
      try { localStorage.setItem(NAME_STORE, playerName()); } catch (e) {}
    });
    el("clearScoresBtn").addEventListener("click", () => {
      if (!confirm("Clear all high scores on this device?")) return;
      const empty = {};
      BOARDS.forEach((b) => { empty[b.id] = []; });
      saveScores(empty);
      renderBoard();
    });
    renderBoard();
    idleScreen("Hit Start when you're ready.");
  </script>
</body>
</html>
